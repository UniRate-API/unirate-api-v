name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: thevlang/vlang:latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Make the module importable
        run: |
          mkdir -p "$HOME/.vmodules"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.vmodules/unirate"

      - name: Format check
        run: v fmt -verify .

      - name: Vet
        run: v vet .

      # `v test .` compiles the whole module and runs the mock suite; the
      # example build compiles the module as an imported dependency. Together
      # they are a full compile check (a standalone `v -shared .` hits a musl
      # ld quirk in the Alpine image on the CI runner and adds nothing).
      - name: Test (mock)
        run: v -W test .

      - name: Build example
        run: v examples/quickstart.v
